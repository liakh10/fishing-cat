<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fishing Cat</title>
<meta name="description" content="He catches them and he puts them back" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/apple-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --deep:#12484f; --teal:#1f7a76; --coral:#f2604a; --mustard:#f2b134; --cream:#fdf3e0; --ink:#0d2c31;
  --disp:"Bricolage Grotesque",system-ui,sans-serif; --mono:"Azeret Mono",ui-monospace,monospace;
  --pad:clamp(14px,2.4vw,32px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--deep);color:var(--cream);font-family:var(--disp);font-weight:600;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#cv{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block}
.tone{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.28;mix-blend-mode:multiply;
  background-image:radial-gradient(rgba(13,44,49,.85) .8px,transparent .8px);background-size:3.4px 3.4px}
.mis{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.14;mix-blend-mode:screen;
  background:linear-gradient(102deg,rgba(242,96,74,.55),rgba(242,177,52,0) 46%,rgba(31,122,118,.5))}

/* ---------- cat ---------- */
.angler{position:fixed;z-index:3;left:9%;bottom:16%;pointer-events:none}
.angler img{height:clamp(215px,44vh,410px);width:auto;max-width:none}
.angler img.off{display:none}

/* ---------- catch on the hook ---------- */
.catch{position:fixed;z-index:3;left:0;top:0;pointer-events:none;opacity:0;transform:translate(-50%,0)}
.catch img{height:clamp(64px,10vh,112px);width:auto;max-width:none}
.catch.on{opacity:1;transition:opacity .18s}

/* ---------- hud ---------- */
.hud{position:fixed;z-index:9;display:flex;gap:7px;align-items:center}
.tl{left:var(--pad);top:var(--pad)}
.tr{right:var(--pad);top:var(--pad)}
.key{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--cream);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .14s,box-shadow .14s}
.key:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.key svg{width:13px;height:13px}
.key img{width:22px;height:22px}
.key.buy{background:var(--coral);color:var(--cream)}
.key.mus{background:var(--mustard);color:var(--ink)}

.mark{position:fixed;left:var(--pad);bottom:var(--pad);z-index:8}
.mark h1{font-family:var(--disp);font-weight:800;font-size:clamp(26px,4vw,50px);line-height:.96;letter-spacing:-.03em;color:var(--cream);text-shadow:3px 3px 0 var(--ink)}
.mark p{margin-top:7px;font-family:var(--mono);font-size:12px;color:var(--cream);opacity:.86;text-shadow:1px 1px 0 rgba(13,44,49,.7)}

/* ---------- log ---------- */
.log{position:fixed;right:var(--pad);top:calc(var(--pad) + 48px);z-index:8;width:min(280px,42vw);display:grid;gap:5px}
.log .hd{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);opacity:.75;margin-bottom:2px;text-align:right}
.row{display:flex;align-items:center;justify-content:flex-end;gap:9px;background:var(--cream);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 rgba(13,44,49,.55);padding:6px 10px;
  opacity:0;transform:translateX(14px);transition:opacity .3s,transform .3s}
.row.on{opacity:1;transform:none}
.row b{font-size:13px;font-weight:800;letter-spacing:-.01em}
.row span{font-family:var(--mono);font-size:10.5px;color:#4f6f70}
.row i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--teal);border:1px solid var(--teal);padding:1px 5px}

/* ---------- board ---------- */
.board{position:fixed;left:50%;bottom:var(--pad);transform:translateX(-50%);z-index:8;width:min(520px,86vw);
  background:var(--cream);color:var(--ink);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 14px;display:grid;gap:9px;justify-items:center;text-align:center}
.board .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:#6b8a8b}
.ca{display:grid;gap:8px;justify-items:center;width:100%;cursor:pointer}
.ca b{font-family:var(--disp);font-weight:800;font-size:clamp(20px,3.2vw,28px);letter-spacing:-.02em}
.ca.live b{font-family:var(--mono);font-weight:500;font-size:clamp(10px,2.5vw,13px);letter-spacing:0;color:var(--teal);word-break:break-all}
.ca .cp{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b8a8b;border:1px solid #cbbfa8;padding:5px 11px}
.ca.live .cp{border-color:var(--teal);color:var(--teal)}
.btns{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.board .key{height:30px;font-size:11.5px;padding:0 11px;box-shadow:2px 2px 0 var(--ink)}

@media (max-width:820px){
  .tr .key.buy span{display:none}
  .tl span{display:none}
  .tl .key{padding:0 10px}
  .angler{left:4%;bottom:22%}
  .angler img{height:clamp(165px,30vh,250px)}
  .log{width:min(210px,52vw);top:calc(var(--pad) + 44px)}
  .row{padding:5px 8px;gap:6px}
  .row b{font-size:11.5px}
  .row span{display:none}
  .mark{bottom:calc(var(--pad) + 152px)}
  .mark h1{font-size:24px}
  .board{width:calc(100% - var(--pad) * 2);padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}

.pmark{width:15px;height:15px;min-width:15px;object-fit:contain;display:inline-block;border:0 !important;border-radius:0 !important}
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div class="tone"></div><div class="mis"></div>

<div class="angler" id="angler">
  <img id="a1" src="assets/cat1.webp" alt="" />
  <img id="a2" class="off" src="assets/cat2.webp" alt="" />
</div>
<div class="catch" id="catchBox"><img id="catchImg" src="assets/c1.webp" alt="" /></div>

<a class="hud tl key" href="/"><img src="assets/avatar.webp" alt="" /><span data-name>Fishing Cat</span></a>
<nav class="hud tr">
  <a class="key buy" data-link="pons" href="https://www.ponsfamily.com/launchpad"><span>Buy</span><img class="pmark" src="assets/pons-mark.png" alt="" /></a>
  <a class="key mus" data-link="x" href="https://x.com" aria-label="X"><svg><use href="#i-x"/></svg></a>
  <a class="key" href="/docs">Docs</a>
</nav>

<div class="mark"><h1>Fishing Cat</h1><p>He catches them and he puts them back</p></div>

<div class="log" id="log"><div class="hd">Caught and released</div></div>

<div class="board">
  <div class="l">Contract</div>
  <div class="ca" id="ca"><b id="caVal">soon</b><button class="cp" id="caCopy">Copy</button></div>
  <div class="btns">
    <a class="key buy" data-link="pons" href="https://www.ponsfamily.com/launchpad">Buy on Pons<img class="pmark" src="assets/pons-mark.png" alt="" /></a>
    <a class="key mus" data-link="x" href="https://x.com" aria-label="X"><svg><use href="#i-x"/></svg></a>
    <a class="key" href="/docs">Docs</a>
  </div>
</div>

<audio id="bgm" src="assets/music.mp3" loop preload="none"></audio>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pons" viewBox="0 0 64 64"><path d="M14 8h24c11 0 18 7 18 17s-7 17-18 17h-9v12a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3z" fill="currentColor"/><path d="M29 20h8c4 0 6.5 2 6.5 5s-2.5 5-6.5 5h-8z" fill="#fff" opacity=".9"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="currentColor" d="M18.9 2H22l-7.1 8.1L23 22h-6.6l-5.2-6.8L5.3 22H2.1l7.6-8.7L1.5 2h6.7l4.7 6.2L18.9 2zm-1.1 18h1.8L7.3 3.9H5.4L17.8 20z"/></symbol>
</svg>

<script>
(function(){
  var S = window.SITE, CA = (S.CA||"SOON").trim(), HAS_CA = CA !== "SOON" && CA !== "";
  document.querySelectorAll('[data-name]').forEach(function(e){ e.textContent = S.NAME; });
  document.title = S.NAME;
  document.querySelectorAll('[data-link="pons"]').forEach(function(a){ a.href = HAS_CA ? window.PONS_HOME + '/' + CA : window.PONS_HOME; a.target='_blank'; a.rel='noopener'; });
  document.querySelectorAll('[data-link="x"]').forEach(function(a){ a.href = S.X_URL || 'https://x.com'; a.target='_blank'; a.rel='noopener'; });
  var caBox = document.getElementById('ca'), caVal = document.getElementById('caVal'), caCopy = document.getElementById('caCopy');
  caVal.textContent = HAS_CA ? CA : 'soon';
  if(HAS_CA){ caBox.classList.add('live'); caBox.title = CA; }
  caBox.addEventListener('click', function(){ var old = caCopy.textContent; if(HAS_CA){ if(navigator.clipboard) navigator.clipboard.writeText(CA); caCopy.textContent = 'Copied'; } else { caCopy.textContent = 'Not yet'; } setTimeout(function(){ caCopy.textContent = old; }, 1300); });

  var bgm = document.getElementById('bgm'), armed = false, hasMusic = true;
  bgm.addEventListener('error', function(){ hasMusic = false; });
  function arm(){ if(armed) return; armed = true; if(hasMusic){ bgm.volume = .2; bgm.play().catch(function(){}); } }
  document.addEventListener('pointerdown', arm, true); document.addEventListener('keydown', arm, true);

  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CATCH = [
    { f:'c1', n:'A doge',        s:'Wanted to know where the moon was' },
    { f:'c2', n:'A pepe',        s:'Green already, no notes' },
    { f:'c3', n:'An old boot',   s:'Third time this week' },
    { f:'c4', n:'A laptop',      s:'Still logged in, put it straight back' },
    { f:'c5', n:'A bag',         s:'Somebody was holding this' },
    { f:'c6', n:'One good fish', s:'Released, obviously' }
  ];

  /* ---------- canvas ---------- */
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), DPR = Math.min(2, devicePixelRatio || 1);
  var VW = 0, VH = 0, HZ = 0;
  function size(){
    VW = innerWidth || 1200; VH = innerHeight || 800;
    cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    HZ = VH * .5;
  }
  size();
  addEventListener('resize', size);

  /* far shore, generated once so it never redraws differently */
  function rnd(s){ var x = Math.sin(s * 12.9898) * 43758.5453; return x - Math.floor(x); }
  var SHORE = [];
  for(var i = 0; i <= 40; i++) SHORE.push(rnd(i * 3.1) * .5 + rnd(i * .7) * .5);

  /* ---------- the line ---------- */
  var N = 22, pts = [], rest = 0;
  function seedLine(ax, ay, bx, by){
    pts = [];
    for(var i = 0; i < N; i++){
      var t = i / (N - 1);
      pts.push({ x: ax + (bx - ax) * t, y: ay + (by - ay) * t, px: ax + (bx - ax) * t, py: ay + (by - ay) * t });
    }
    rest = Math.hypot(bx - ax, by - ay) / (N - 1);
  }
  function solve(ax, ay, bx, by){
    for(var i = 1; i < N; i++){
      var p = pts[i], vx = (p.x - p.px) * .93, vy = (p.y - p.py) * .93;
      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy + .55;
    }
    for(var k = 0; k < 8; k++){
      pts[0].x = ax; pts[0].y = ay;
      pts[N - 1].x = bx; pts[N - 1].y = by;
      for(var j = 0; j < N - 1; j++){
        var a = pts[j], b = pts[j + 1];
        var dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || .001;
        var f = (d - rest) / d * .5;
        if(j > 0){ a.x += dx * f; a.y += dy * f; }
        if(j + 1 < N - 1){ b.x -= dx * f; b.y -= dy * f; }
      }
    }
  }

  /* ---------- ripples & splash ---------- */
  var rings = [], drops = [];
  function ring(x, y){ rings.push({ x:x, y:y, r:4, l:1 }); }
  function splash(x, y, n){
    if(reduce) return;
    for(var i = 0; i < n; i++){
      var a = -Math.PI * (.2 + Math.random() * .6);
      var sp = 2 + Math.random() * 5;
      drops.push({ x:x, y:y, vx:Math.cos(a) * sp * (Math.random() < .5 ? -1 : 1), vy:Math.sin(a) * sp, l:1 });
    }
  }

  /* ---------- the cycle ---------- */
  var angler = document.getElementById('angler'), a1 = document.getElementById('a1'), a2 = document.getElementById('a2');
  var catchBox = document.getElementById('catchBox'), catchImg = document.getElementById('catchImg');
  var logBox = document.getElementById('log');
  var idx = 0, t0 = performance.now(), CYCLE = 7600, logged = [];

  function addLog(c){
    var d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<span>' + c.s + '</span><b>' + c.n + '</b><i>back</i>';
    logBox.appendChild(d);
    requestAnimationFrame(function(){ d.classList.add('on'); });
    logged.push(d);
    while(logged.length > 5){ var g = logged.shift(); g.remove(); }
  }

  function rodTip(){
    var r = angler.getBoundingClientRect();
    return { x: r.left + r.width * .962, y: r.top + r.height * .1375 };
  }

  function waterY(x, t){
    return HZ + VH * .085 + Math.sin(x * .012 + t * .0016) * 5 + Math.sin(x * .031 - t * .0027) * 3;
  }

  var lastPhase = -1, floatX = 0, prevPh = -1;
  function frame(now){
    var t = now - t0;
    var ph = (window.__PH != null) ? window.__PH : (t % CYCLE) / CYCLE;
    var cy = Math.floor(t / CYCLE);
    if(cy !== lastPhase){ lastPhase = cy; idx = cy % CATCH.length; catchImg.src = 'assets/' + CATCH[idx].f + '.webp'; }

    var tip = rodTip();
    if(!pts.length) seedLine(tip.x, tip.y, tip.x + VW * .18, waterY(tip.x + VW * .18, t));

    floatX = tip.x + VW * .22;
    var wy = waterY(floatX, t);

    /* phases: wait .00-.34 | bite .34-.44 | pull .44-.60 | hold .60-.80 | release .80-1 */
    var restX = tip.x + VW * .105, restY = tip.y - VH * .075;
    var hx = floatX, hy = wy, pulling = false, showCatch = false;
    if(ph < .34){ hy = wy; }
    else if(ph < .44){ hy = wy + 12 + Math.sin(ph * 220) * 7; }
    else if(ph < .60){
      pulling = true; showCatch = true;
      var u = (ph - .44) / .16, e = u * u * (3 - 2 * u);
      hx = floatX + (restX - floatX) * e;
      hy = wy + (restY - wy) * e;
    }
    else if(ph < .80){
      pulling = true; showCatch = true;
      hx = restX; hy = restY + Math.sin(ph * 90) * 5;
    }
    else {
      var u2 = (ph - .80) / .20;
      showCatch = u2 < .55;
      hx = restX + (floatX - restX) * u2;
      hy = restY + (wy - restY) * (u2 * u2);
    }

    a1.classList.toggle('off', pulling); a2.classList.toggle('off', !pulling);

    /* one-shot beats, fired the moment the phase crosses them */
    function crossed(mark){ return prevPh < mark && ph >= mark; }
    if(ph < prevPh) prevPh = -1;
    if(crossed(.44)){ splash(floatX, wy, 16); ring(floatX, wy); }
    if(crossed(.62)) addLog(CATCH[idx]);
    if(crossed(.94)){ splash(floatX, wy, 12); ring(floatX, wy); }
    prevPh = ph;
    if(ph < .34 && Math.random() < .012) ring(floatX + (Math.random() - .5) * 30, wy + (Math.random() - .5) * 8);

    solve(tip.x, tip.y, hx, hy);

    catchBox.style.left = hx + 'px';
    catchBox.style.top = (hy + 4) + 'px';
    catchBox.classList.toggle('on', showCatch);

    draw(t, hx, hy, wy, floatX);
    requestAnimationFrame(frame);
  }

  function draw(t, fx, hy, wy, restFloatX){
    ctx.clearRect(0, 0, VW, VH);

    /* sky */
    ctx.fillStyle = '#fdf3e0'; ctx.fillRect(0, 0, VW, HZ);
    ctx.fillStyle = '#f2b134'; ctx.fillRect(0, HZ * .34, VW, HZ * .66);
    ctx.fillStyle = '#f2604a'; ctx.fillRect(0, HZ * .70, VW, HZ * .30);
    /* sun */
    ctx.fillStyle = '#fdf3e0'; ctx.beginPath(); ctx.arc(VW * .72, HZ * .5, Math.min(VW, VH) * .11, 0, 7); ctx.fill();

    /* far shore */
    ctx.fillStyle = '#12484f';
    ctx.beginPath(); ctx.moveTo(0, HZ);
    for(var i = 0; i <= 40; i++){
      var x = i / 40 * VW;
      var h = (SHORE[i] * .5 + Math.sin(i * .55) * .5 + 1) * VH * .022;
      ctx.lineTo(x, HZ - h);
    }
    ctx.lineTo(VW, HZ); ctx.closePath(); ctx.fill();

    /* water */
    ctx.fillStyle = '#1f7a76'; ctx.fillRect(0, HZ, VW, VH - HZ);
    ctx.fillStyle = '#12484f'; ctx.fillRect(0, HZ + (VH - HZ) * .46, VW, VH);
    /* surface bands */
    ctx.strokeStyle = 'rgba(253,243,224,.5)'; ctx.lineWidth = 2;
    for(var b = 0; b < 9; b++){
      var yy = HZ + (VH - HZ) * (.05 + b * .1);
      ctx.beginPath();
      for(var xx = 0; xx <= VW; xx += 14){
        var o = Math.sin(xx * .014 + t * .0014 + b) * (3 + b) + Math.sin(xx * .04 - t * .0022) * 2;
        if(xx === 0) ctx.moveTo(xx, yy + o); else ctx.lineTo(xx, yy + o);
      }
      ctx.stroke();
    }
    /* sun path on the water */
    ctx.fillStyle = 'rgba(242,177,52,.32)';
    for(var s = 0; s < 7; s++){
      var sy = HZ + (VH - HZ) * (.04 + s * .13);
      var w = (VW * .16) * (1 + s * .22);
      ctx.fillRect(VW * .72 - w / 2, sy, w, 5 + s);
    }

    /* jetty */
    var jw = VW * .34, jy = VH * .84;
    ctx.fillStyle = '#0d2c31'; ctx.fillRect(jw - 26, jy + 10, 16, VH);
    ctx.fillRect(jw * .42, jy + 10, 16, VH);
    ctx.fillStyle = '#8a4f2c'; ctx.fillRect(-10, jy, jw, VH);
    ctx.fillStyle = '#6d3d21'; ctx.fillRect(-10, jy, jw, 9);
    ctx.strokeStyle = 'rgba(253,243,224,.34)'; ctx.lineWidth = 2;
    for(var p = 0; p < 8; p++){
      var py = jy + 22 + p * 17;
      if(py > VH) break;
      ctx.beginPath(); ctx.moveTo(-10, py); ctx.lineTo(jw, py); ctx.stroke();
    }
    ctx.strokeStyle = '#0d2c31'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(jw, jy); ctx.lineTo(jw, VH); ctx.stroke();

    /* ripples */
    ctx.strokeStyle = 'rgba(253,243,224,.7)';
    for(var r = rings.length - 1; r >= 0; r--){
      var g = rings[r]; g.r += 1.3; g.l -= .016;
      if(g.l <= 0){ rings.splice(r, 1); continue; }
      ctx.globalAlpha = Math.max(0, g.l); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(g.x, g.y, g.r, g.r * .32, 0, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* line */
    ctx.strokeStyle = '#fdf3e0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for(var i2 = 1; i2 < N; i2++) ctx.lineTo(pts[i2].x, pts[i2].y);
    ctx.stroke();
    /* float */
    ctx.fillStyle = '#f2604a'; ctx.beginPath(); ctx.arc(fx, hy, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#fdf3e0'; ctx.beginPath(); ctx.arc(fx, hy - 2, 3, 0, 7); ctx.fill();
    void restFloatX;

    /* drops */
    if(drops.length){
      ctx.fillStyle = '#fdf3e0';
      for(var d = drops.length - 1; d >= 0; d--){
        var q = drops[d]; q.vy += .3; q.x += q.vx; q.y += q.vy; q.l -= .02;
        if(q.l <= 0){ drops.splice(d, 1); continue; }
        ctx.globalAlpha = Math.max(0, q.l); ctx.fillRect(q.x, q.y, 3, 3);
      }
      ctx.globalAlpha = 1;
    }
  }

  addEventListener('load', function(){ size(); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
